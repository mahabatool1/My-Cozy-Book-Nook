<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cozy Book Nook</title>
    <script>
      // Gracefully prevent benign HMR WebSocket/Vite connection error alerts or unhandled rejections from bubbling up.
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          String(event.reason.message || event.reason).includes('WebSocket') || 
          String(event.reason.message || event.reason).includes('websocket') || 
          String(event.reason.message || event.reason).includes('vite') ||
          String(event.reason.message || event.reason).includes('connection')
        )) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && (
          event.message.includes('WebSocket') || 
          event.message.includes('websocket') || 
          event.message.includes('vite') ||
          event.message.includes('connection')
        )) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
